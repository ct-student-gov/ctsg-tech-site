            <li>
              <article>
                <h3>
                  <button class="event-card" type="button" aria-haspopup="dialog" aria-controls="sunset-sendoff-2026-details" aria-labelledby="sunset-sendoff-2026-title">
                    <img class="event-card-image" src="images/events/2026/sunset-sendoff/poster.jpg" alt="" width="3355" height="3750" loading="lazy">
                    <span class="event-card-title" id="sunset-sendoff-2026-title">Sunset Sendoff 2026</span>
                    <time class="event-card-date" datetime="2026-05-02">May 2, 2026</time>
                    <span class="event-card-action">View event <span aria-hidden="true">+</span></span>
                  </button>
                </h3>
                <dialog class="event-details" id="sunset-sendoff-2026-details" aria-labelledby="sunset-sendoff-2026-details-title">
                  <form method="dialog" class="event-details-close">
                    <button type="submit" aria-label="Close" autofocus><span aria-hidden="true">×</span></button>
                  </form>
                  <div class="event-gallery" tabindex="0" role="region" aria-label="Sunset Sendoff 2026 images">
                    <figure>
                      <img src="images/events/2026/sunset-sendoff/poster.jpg" alt="Sunset Sendoff poster for the Class of 2026, May 2, 6–10 PM at Somewhere Nowhere." width="3355" height="3750" loading="lazy">
                      <figcaption><span>Sunset Sendoff poster for the Class of 2026, May 2, 6–10 PM at Somewhere Nowhere.</span><span class="event-photo-credit">Poster: CTSG.</span></figcaption>
                    </figure>
                  </div>
                  <div class="event-details-body">
                  <h2 id="sunset-sendoff-2026-details-title">Sunset Sendoff 2026</h2>
                  <p class="eyebrow"><time datetime="2026-05-02">May 2, 2026</time></p>
                  <p>With graduation approaching, Sunset Sendoff gave the Class of 2026 an evening to celebrate together at Somewhere Nowhere in Manhattan. The May 2 celebration ran from 6–10 PM, with a program spread across two floors: a live jazz ensemble on Floor 39 and a high-energy DJ set on Floor 38.</p>
                  <p>Students could choose their pace for the evening, from jazz and conversation to the dance floor. A taco station, dessert bar, and photo booth rounded out the program. It was a sendoff built around spending time with the people who had shared the Cornell Tech experience, before the class headed into its next chapter.</p>
                  </div>
                </dialog>
              </article>
            </li>
            <li>
              <article>
                <h3>
                  <button class="event-card" type="button" aria-haspopup="dialog" aria-controls="big-red-gala-2026-details" aria-labelledby="big-red-gala-2026-title">
                    <img class="event-card-image" src="images/events/2026/big-red-gala/group-portrait.jpg" alt="" width="6240" height="4160" loading="lazy">
                    <span class="event-card-title" id="big-red-gala-2026-title">Big Red Gala 2026</span>
                    <time class="event-card-date" datetime="2026-02-07">February 7, 2026</time>
                    <span class="event-card-action">View photos <span aria-hidden="true">+</span></span>
                  </button>
                </h3>
                <dialog class="event-details" id="big-red-gala-2026-details" aria-labelledby="big-red-gala-2026-details-title">
                  <form method="dialog" class="event-details-close">
                    <button type="submit" aria-label="Close" autofocus><span aria-hidden="true">×</span></button>
                  </form>
                  <div class="event-gallery" tabindex="0" role="region" aria-label="Big Red Gala 2026 images">
                    <figure>
                      <img src="images/events/2026/big-red-gala/group-portrait.jpg" alt="Four guests pose together in formal attire at the Big Red Gala." width="6240" height="4160" loading="lazy">
                      <figcaption><span>Four guests pose together in formal attire at the Big Red Gala.</span><span class="event-photo-credit">Photo: Opalina (@opalinakhanna).</span></figcaption>
                    </figure>
                    <figure>
                      <img src="images/events/2026/big-red-gala/portrait.jpg" alt="Two smiling guests pose in front of red curtains at the gala." width="6000" height="4000" loading="lazy">
                      <figcaption><span>Two smiling guests pose in front of red curtains at the gala.</span><span class="event-photo-credit">Photo: Abe (@abe.baali).</span></figcaption>
                    </figure>
                  </div>
                  <div class="event-details-body">
                  <h2 id="big-red-gala-2026-details-title">Big Red Gala 2026</h2>
                  <p class="eyebrow"><time datetime="2026-02-07">February 7, 2026</time></p>
                  <p>Spring semester began with a reason to dress up. The Big Red Gala was CTSG’s first party of spring 2026, and all 270 tickets sold out. The February 7 celebration brought Cornell Tech students together with 40 students from PACT for a formal night out.</p>
                  <p>The evening’s program centered on music and dancing, with a DJ booked for the entire event and a photo booth for pictures with friends. Student photographers captured the occasion too, including the portraits in this gallery. After the winter break, the gala offered a shared start to the semester beyond classes and studio work.</p>
                  </div>
                </dialog>
              </article>
            </li>
            <li>
              <article>
                <h3>
                  <button class="event-card" type="button" aria-haspopup="dialog" aria-controls="cornelloween-2025-details" aria-labelledby="cornelloween-2025-title">
                    <img class="event-card-image" src="images/events/2025/cornelloween/celebration.jpg" alt="" width="3240" height="2160" loading="lazy">
                    <span class="event-card-title" id="cornelloween-2025-title">Cornelloween 2025</span>
                    <time class="event-card-date" datetime="2025-10-30">October 30, 2025</time>
                    <span class="event-card-action">View photos <span aria-hidden="true">+</span></span>
                  </button>

                    <button type="submit" aria-label="Close" autofocus><span aria-hidden="true">×</span></button>
                  </form>
                  <div class="event-gallery" tabindex="0" role="region" aria-label="Cornelloween 2025 images">
                    <figure>
                      <img src="images/events/2025/cornelloween/celebration.jpg" alt="Costumed students gather beneath hanging skeletons and a disco ball." width="3240" height="2160" loading="lazy">
                      <figcaption><span>Costumed students gather beneath hanging skeletons and a disco ball.</span><span class="event-photo-credit">Source: CTSG event archive.</span></figcaption>
                    </figure>
                    <figure>
                      <img src="images/events/2025/cornelloween/colorful-costumes.jpg" alt="Four friends smile in coordinated costumes with colorful fuzzy hats." width="2160" height="3240" loading="lazy">
                      <figcaption><span>Four friends smile in coordinated costumes with colorful fuzzy hats.</span><span class="event-photo-credit">Source: CTSG event archive.</span></figcaption>
                    </figure>
                    <figure>
                      <img src="images/events/2025/cornelloween/costume-portrait.jpg" alt="Four guests pose together in Halloween costumes." width="2160" height="3240" loading="lazy">
                      <figcaption><span>Four guests pose together in Halloween costumes.</span><span class="event-photo-credit">Source: CTSG event archive.</span></figcaption>
                    </figure>
                  </div>
                  <div class="event-details-body">
                  <h2 id="cornelloween-2025-details-title">Cornelloween 2025</h2>
                  <p class="eyebrow"><time datetime="2025-10-30">October 30, 2025</time></p>
                  <p>Halloween arrived a night early for Cornell Tech at The DL rooftop on October 30. Cornelloween put students’ costumes at the center of the celebration, with a fashion show on the evening’s schedule and a costume contest inviting guests to vote for their favorites.</p>
                  <p>Doors opened at 8:30 PM, with the fashion show scheduled for 10 and more dancing from 11:30. The music program combined a Cornelloween playlist with a closing set from CTSG’s own DJ, while a photo backdrop gave friends a place to capture their outfits together. From coordinated group costumes to individual creations, the night made room for a different kind of student creativity.</p>
                  </div>
                </dialog>
              </article>
            </li>
            <li>
              <article>
                <h3>
                  <button class="event-card" type="button" aria-haspopup="dialog" aria-controls="club-fair-2025-details" aria-labelledby="club-fair-2025-title">
                    <img class="event-card-image" src="images/events/2025/club-fair/campus-group.jpg" alt="" width="4288" height="2848" loading="lazy">

                    <time class="event-card-date" datetime="2025-09-18">September 18, 2025</time>
                    <span class="event-card-action">View photos <span aria-hidden="true">+</span></span>
                  </button>
                </h3>
                <dialog class="event-details" id="club-fair-2025-details" aria-labelledby="club-fair-2025-details-title">
                  <form method="dialog" class="event-details-close">
                    <button type="submit" aria-label="Close" autofocus><span aria-hidden="true">×</span></button>
                  </form>
                  <div class="event-gallery" tabindex="0" role="region" aria-label="Club Fair 2025 images">
                    <figure>
                      <img src="images/events/2025/club-fair/campus-group.jpg" alt="Seven students smile together outside the Bloomberg Center." width="4288" height="2848" loading="lazy">
                      <figcaption><span>Seven students smile together outside the Bloomberg Center.</span><span class="event-photo-credit">Photo: Nghi T.</span></figcaption>
                    </figure>
                    <figure>
                      <img src="images/events/2025/club-fair/future-founders-club.jpg" alt="Two smiling students hold Future Founders Club signs outside on campus." width="4288" height="2848" loading="lazy">
                      <figcaption><span>Two smiling students hold Future Founders Club signs outside on campus.</span><span class="event-photo-credit">Photo: Nghi T.</span></figcaption>
                    </figure>
                  </div>
                  <div class="event-details-body">
                  <h2 id="club-fair-2025-details-title">Club Fair 2025</h2>
                  <p class="eyebrow"><time datetime="2025-09-18">September 18, 2025</time></p>
                  <p>The fall Club Fair was a starting point for finding a community at Cornell Tech. On September 18, students met the people behind campus club ideas, learned what they hoped to organize, and explored ways to get involved. The outdoor fair ran from 4:30–5:30 PM, with time set aside in the Product Studio schedule so students in the class could attend.</p>
                  <p>The lineup spanned professional interests, shared hobbies, and community life. Future Founders Club and Women in Tech appeared alongside groups focused on cooking, chess, board games, and community service. For students bringing a new club idea to campus, the fair was also an opportunity to meet potential members and connect with others building similar communities.</p>
                  </div>
                </dialog>
              </article>
            </li>
