  <template id="home-template">
    <div class="home">
      <div class="home-banner">
        <img src="./images/cornell-tech-campus.webp" width="2048" height="1534" alt="Cornell Tech campus on Roosevelt Island with the Queensboro Bridge behind it">
      </div>
      <section class="home-intro">
        <h1>A voice for<br>our community.</h1>
        <p>We represent Cornell Tech master’s students, support student groups, and bring our community together.</p>
      </section>
      <div class="home-highlights">
        <section class="home-event" aria-labelledby="student-life-heading">
          <h2 class="eyebrow" id="student-life-heading">Student life</h2>
          <!-- Each future carousel slide keeps its photograph and event title together. -->
          <figure class="home-event-slide">
            <a class="home-event-image" href="#/events" aria-labelledby="home-event-title">
              <img src="./images/current-site/2024/11/21-DSCF1036.webp" width="1920" height="1280" alt="Students performing music at the Cornell Tech Club Fair">
            </a>
            <figcaption><h3 class="feature-title" id="home-event-title"><a href="#/events">Coming together at <span class="link-ending">Club Fair <span class="link-arrow" aria-hidden="true">↗</span></span></a></h3></figcaption>
          </figure>
        </section>
        <section class="home-people" aria-labelledby="representatives-heading">
          <h2 class="eyebrow" id="representatives-heading">Your representatives</h2>
          <div class="home-people-content">
          <a class="home-portraits" href="#/members" aria-labelledby="home-people-title">
            <img src="./images/members/maxime-hendryx-parker.webp" width="768" height="1024" alt="Maxime Hendryx-Parker">
            <img src="./images/current-site/2026/09/IMG_7087-Robert-Dornbush.webp" width="280" height="280" alt="Robbie Dornbush">
          </a>
          <h3 class="feature-title" id="home-people-title"><a href="#/members">Meet your <span class="link-ending">representatives <span class="link-arrow" aria-hidden="true">↗</span></span></a></h3>
          </div>
        </section>
      </div>
      <div class="home-resources">
        <a class="editorial-tile home-governance" href="#/by-laws">
          <span>Student government</span>
          <h2 class="editorial-tile-title">How<br>we work.</h2>
          <span class="editorial-tile-footer"><span class="link-label">The CTSG by-laws</span><span class="link-arrow" aria-hidden="true">↗</span></span>
        </a>
        <a class="editorial-tile home-clubs" href="https://cornelltech.campusgroups.com/club_signup">
          <span>Our community</span>
          <h2 class="editorial-tile-title">Find your people.</h2>
          <span class="editorial-tile-footer"><span class="link-label">Explore student clubs</span><span class="link-arrow" aria-hidden="true">↗</span></span>
        </a>
      </div>

      </div>

      </div>
    </div>
