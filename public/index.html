<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cornell Tech Student Government</title>
  <link rel="icon" type="image/webp" sizes="96x96" href="./images/favicon.webp">
  <link rel="icon" type="image/svg+xml" href="https://www.cornell.edu/favicon.svg">
  <link rel="shortcut icon" type="image/webp" href="./images/favicon.webp">
  <meta name="description" content="We represent Cornell Tech master’s students, support student groups, and bring our community together.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Cornell Tech Student Government">
  <meta property="og:description" content="We represent Cornell Tech master’s students, support student groups, and bring our community together.">
  <meta property="og:image" content="https://ct-student-gov.github.io/ctsg-tech-site/public/images/cornell-tech-campus.webp">
  <meta property="og:image:type" content="image/webp">
  <meta property="og:image:width" content="2048">
  <meta property="og:image:height" content="1534">
  <meta property="og:image:alt" content="Cornell Tech campus on Roosevelt Island with the Queensboro Bridge behind it">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Cornell Tech Student Government">
  <meta name="twitter:description" content="We represent Cornell Tech master’s students, support student groups, and bring our community together.">
  <meta name="twitter:image" content="https://ct-student-gov.github.io/ctsg-tech-site/public/images/cornell-tech-campus.webp">
  <meta name="twitter:image:alt" content="Cornell Tech campus on Roosevelt Island with the Queensboro Bridge behind it">
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="stylesheet" href="./styles/home.css">
  <link rel="stylesheet" href="./styles/members.css">
  <link rel="stylesheet" href="./styles/governance.css">
  <link rel="stylesheet" href="./styles/events.css?v=week-lines-1">
  <script type="module" src="./app.js?v=posthog-1"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to main content</a>
  <div class="site-header-space">
  <header class="site-header">
    <div class="site-identity">
      <a class="site-seal" href="https://tech.cornell.edu/" aria-label="Cornell Tech home">
        <img src="https://cdn.jsdelivr.net/gh/CornellCustomDev/cwd_base@380b1b6432f70b5c0abd0163a267f04d05e3e889/images/cornell/bold_cornell_seal_simple_white.svg" width="80" height="80" alt="Cornell University seal">
      </a>
      <a class="site-name" href="#/">Cornell Tech<br>Student Government</a>
    </div>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="#/">About</a>
      <a href="#/members">People</a>
      <a href="#/events">Events</a>
      <a href="#/by-laws">Governance</a>
    </nav>
  </header>
  </div>
  <main id="content" class="site-content" tabindex="-1"></main>
  <footer class="site-footer">
    <span>© 2026 Cornell Tech Student Government</span>
    <a href="mailto:ctsg@cornell.edu">ctsg@cornell.edu</a>
  </footer>
  <template id="home-template">
    <div class="home">
      <div class="home-banner">
        <img src="./images/cornell-tech-campus.webp" width="2048" height="1534" alt="Cornell Tech campus on Roosevelt Island with the Queensboro Bridge behind it">
      </div>
      <section class="home-intro">
        <h1>A voice for<br>our community.</h1>
        <p>We represent Cornell Tech master’s students, support student groups, and bring our community together.</p>
      </section>
      <div class="home-highlights">
        <section class="home-event" aria-labelledby="student-life-heading">
          <h2 class="eyebrow" id="student-life-heading">Student life</h2>
          <!-- Each future carousel slide keeps its photograph and event title together. -->
          <figure class="home-event-slide">
            <a class="home-event-image" href="#/events" aria-labelledby="home-event-title">
              <img src="./images/current-site/2024/11/21-DSCF1036.webp" width="1920" height="1280" alt="Students performing music at the Cornell Tech Club Fair">
            </a>
            <figcaption><h3 class="feature-title" id="home-event-title"><a href="#/events">Coming together at <span class="link-ending">Club Fair <span class="link-arrow" aria-hidden="true">↗&#xfe0e;</span></span></a></h3></figcaption>
          </figure>
        </section>
        <section class="home-people" aria-labelledby="representatives-heading">
          <h2 class="eyebrow" id="representatives-heading">Your representatives</h2>
          <div class="home-people-content">
          <a class="home-portraits" href="#/members" aria-labelledby="home-people-title">
            <img src="./images/members/maxime-hendryx-parker.webp" width="768" height="1024" alt="Maxime Hendryx-Parker">
            <img src="./images/current-site/2026/09/IMG_7087-Robert-Dornbush.webp" width="280" height="280" alt="Robbie Dornbush">
          </a>
          <h3 class="feature-title" id="home-people-title"><a href="#/members">Meet your <span class="link-ending">representatives <span class="link-arrow" aria-hidden="true">↗&#xfe0e;</span></span></a></h3>
          </div>
        </section>
      </div>
      <section class="home-calendar" aria-labelledby="home-calendar-heading">
        <h2 class="eyebrow" id="home-calendar-heading">Events</h2>
        <div class="student-calendar">
          <div class="calendar-controls home-calendar-controls">
            <h3 class="calendar-month" aria-live="polite"></h3>
            <div class="home-calendar-arrows">
              <button type="button" data-direction="-1" aria-label="Previous view"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14 6-6 6 6 6"/></svg></button>
              <button type="button" data-direction="1" aria-label="Next view"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10 6 6 6-6 6"/></svg></button>
              <button type="button" data-reset aria-label="Back to today" title="Back to today"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/><rect x="10" y="13" width="4" height="4" fill="currentColor" stroke="none"/></svg></button>
            </div>
          </div>
          <div class="calendar-display" tabindex="0" role="region" aria-label="Event calendar"></div>
          <p class="calendar-status" role="status">Loading events…</p>
          <p class="feature-title home-calendar-link"><a href="#/events">View full <span class="link-ending">calendar <span class="link-arrow" aria-hidden="true">↗&#xfe0e;</span></span></a></p>
          <dialog class="calendar-dialog" aria-labelledby="calendar-event-title">
            <button type="button" class="calendar-dialog-close">Close</button>
            <div class="calendar-dialog-body"></div>
          </dialog>
        </div>
      </section>
        <section class="events-projects" aria-labelledby="home-blog-heading">
          <h2 class="eyebrow" id="home-blog-heading">Blog</h2>
          <!-- Posts are maintained in Notion Blog and saved in data/blog.js. -->
          <ol class="events-project-list" id="home-project-list" role="list"></ol>
          <button class="home-projects-toggle" type="button" aria-expanded="false" aria-controls="home-project-list" hidden>Show more</button>
        </section>
    </div>
  </template>
  <template id="members-template">
    <div class="members">
      <div class="home-banner members-banner">
        <p class="members-banner-placeholder">Group photo coming soon</p>
      </div>
      <div class="members-directory">
        <div class="members-years"></div>
      </div>
    </div>
  </template>
  <template id="governance-template">
    <div class="governance">
      <div class="home-banner governance-banner">
        <img src="./images/bylaws-banner.webp" width="2048" height="1366" alt="Students collaborating around a table with laptops and whiteboards at Cornell Tech">
      </div>
      <div class="governance-content">
        <h1>Bylaws</h1>
        <iframe class="governance-document" title="CTSG bylaws (view only)" src="https://drive.google.com/file/d/1xwneLjEeZjxIEYvbnVTjp2b53i5Cdyny/preview"></iframe>
      </div>
    </div>
  </template>
  <template id="events-template">
    <div class="events">
      <div class="home-banner events-banner">
        <img src="images/events/2025/cornelloween/celebration.jpg" width="3240" height="2160" alt="Cornell Tech students celebrate Cornelloween beneath a disco ball and Halloween decorations.">
      </div>
      <div class="events-content">
        <h1>Event Calendar</h1>
        <section class="events-calendar" aria-label="Student event calendar">
          <div class="student-calendar">
            <div class="calendar-controls">
              <details class="calendar-menu calendar-subscription-menu">
                <summary>Add to calendar<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></summary>
                <div class="calendar-menu-panel calendar-subscription-panel">
                  <a data-calendar-provider="google" target="_blank" rel="noopener noreferrer">Google Calendar</a>
                  <a data-calendar-provider="apple">Apple Calendar</a>
                  <a data-calendar-provider="outlook" target="_blank" rel="noopener noreferrer">Outlook</a>
                  <button type="button" data-calendar-copy>Copy calendar link</button>
                  <a class="calendar-download" href="./data/calendar.ics" download="ctsg-events.ics">Download .ics</a>
                  <label class="calendar-feed-field" hidden>Calendar link<input type="text" class="calendar-feed-url" readonly></label>
                  <p class="calendar-copy-status" role="status"></p>
                </div>
              </details>
              <div class="calendar-navigation">
                <button type="button" data-direction="-1" aria-label="Previous month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
                <h3 class="calendar-month" aria-live="polite"></h3>
                <button type="button" data-direction="1" aria-label="Next month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
              </div>
              <div class="calendar-display-actions">
                <details class="calendar-menu calendar-filter-menu">
                  <summary aria-label="Filter calendars" title="Filter calendars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8Z"/></svg></summary>
                  <fieldset class="calendar-menu-panel calendar-filters">
                    <legend>Calendars</legend>
                    <label><input type="checkbox" name="calendar-source" value="student-affairs" checked> Student Affairs</label>
                    <label><input type="checkbox" name="calendar-source" value="career-management" checked> Career Management</label>
                    <label><input type="checkbox" name="calendar-source" value="clubs" checked> Clubs</label>
                    <label><input type="checkbox" name="calendar-source" value="community" checked> Community</label>
                    <label><input type="checkbox" name="calendar-source" value="ctsg" checked> CTSG</label>
                    <label><input type="checkbox" name="calendar-source" value="academic" checked> Academic dates</label>
                  </fieldset>
                </details>
                <details class="calendar-menu calendar-sort-menu">
                  <summary aria-label="Calendar view" title="Calendar view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 12h7M4 18h4M18 5v14m-3-3 3 3 3-3"/></svg></summary>
                  <fieldset class="calendar-menu-panel calendar-views">
                    <legend>Calendar view</legend>
                    <label><input type="radio" name="calendar-view" value="week"> Week</label>
                    <label><input type="radio" name="calendar-view" value="month" checked> Month</label>
                    <label><input type="radio" name="calendar-view" value="list"> List</label>
                  </fieldset>
                </details>
              </div>
            </div>
            <div class="calendar-display"></div>
            <p class="calendar-status" role="status" hidden></p>
            <dialog class="calendar-dialog" aria-labelledby="calendar-event-title">
              <button type="button" class="calendar-dialog-close">Close</button>
              <div class="calendar-dialog-body"></div>
            </dialog>
          </div>
        </section>

      </div>
    </div>
  </template>
  <noscript>JavaScript is required to view this site.</noscript>
</body>
</html>
